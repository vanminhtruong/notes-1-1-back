# Render Blueprint (FREE instance, no paid features).
# WARNING: Free web services have an ephemeral filesystem and spin down after 15 minutes idle,
# so the local SQLite database is wiped on every spin-down / restart / redeploy.
# Use this only for demos. Data that must survive needs a host with a persistent volume
# or the backend running on your own machine behind a tunnel.
services:
  - type: web
    name: notes-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # PORT is injected by Render; server.js already reads process.env.PORT.
      - key: SQLITE_STORAGE
        value: /tmp/app.sqlite
      # Browser origins only (no path). Comma-separated allowlist.
      - key: FRONT_ORIGIN
        value: https://vanminhtruong.github.io
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: GOOGLE_CLIENT_ID
        sync: false
